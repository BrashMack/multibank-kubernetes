apiVersion: v1
kind: Secret
metadata:
  name: multibank-secrets
  namespace: multibank
type: Opaque
stringData:
  POSTGRES_USER: multibank
  POSTGRES_PASSWORD: multibank-demo-password
  POSTGRES_DB: multibank
  REDIS_PASSWORD: redis-demo-password
  DATABASE_URL: postgres://multibank:multibank-demo-password@postgres:5432/multibank?sslmode=disable
  secrets.yaml: |
    Providers:
      JWT:
        Secret: "local-demo-jwt-secret"
      Redis:
        Approved:
          Client:
            Password: "redis-demo-password"
        Awaiting:
          Client:
            Password: "redis-demo-password"
      Storage:
        Password: "multibank-demo-password"
      OpenAPI:
        TeamID: ""
        TeamSecretID: ""

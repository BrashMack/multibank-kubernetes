apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: multibank
data:
  config.yaml: |
    API:
      CorsPolitics:
        AllowOrigins:
          - "http://multibank.local"
          - "http://localhost:18080"
        AllowMethods:
          - "GET"
          - "POST"
          - "OPTIONS"
        AllowHeaders:
          - "Content-Type"
          - "Accept"
          - "Origin"
          - "Authorization"
        AllowCredentials: true
    Service:
      BankToName:
        "awesomebank": "AwesomeBank"
        "virtualbank": "VirtualBank"
        "smartbank": "SmartBank"
      Deposit:
        Priority:
          ProductID: ""
          ProductName: ""
          Bank: ""
          Currency: ""
          InterestRate: ""
          MinAmount: ""
          MaxAmount: ""
          TermMonths: 12
    Providers:
      Redis:
        Approved:
          Client:
            Host: "redis-approved"
            Port: "6379"
            DB: 0
        Awaiting:
          Client:
            Host: "redis-awaiting"
            Port: "6379"
            DB: 0
      Storage:
        Host: "postgres"
        Database: "multibank"
        User: "multibank"
        Port: "5432"
      OpenAPI:
        Disabled: true
        Client:
          Insecure: true
          Retry:
            Codes:
              - 500
              - 501
              - 502
              - 503
              - 429
        BaseUrls:
          "awesomebank": "https://abank.open.bankingapi.ru"
          "virtualbank": "https://vbank.open.bankingapi.ru"
          "smartbank": "https://sbank.open.bankingapi.ru"
        BankToCode:
          "awesomebank": "abank"
          "virtualbank": "vbank"
          "smartbank": "sbank"
    Logger:
      DisableColors: true
      FullTimestamp: true
      PathToFile: ""
      Level: "info"
---

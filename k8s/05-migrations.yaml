apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: multibank
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          imagePullPolicy: IfNotPresent
          args:
            - -path=/migrations
            - -database=$(DATABASE_URL)
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: multibank-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: migrations
          configMap:
            name: migration-files
